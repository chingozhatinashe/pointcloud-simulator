[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bim-inference"
version = "0.1.0"
description = "Bayesian BIM reconstruction from LiDAR point clouds"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
    "networkx",
    "shapely",
    "matplotlib",
    "laspy",
    "open3d",
    "h5py",
    "optax",
    "flax",
    "blackjax",
    "tqdm",
    "pye57>=0.4.19",
    "ifcopenshell>=0.8.5",
]

[project.optional-dependencies]
benchmarks = [
    "plyfile",
    "trimesh",
]
research = [
    "sbi",
    "optuna",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyter",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["representation", "simulator", "data", "inference"]

[tool.pytest.ini_options]
testpaths = [
    "representation/tests",
    "simulator/tests",
    "data/tests",
    "inference/tests",
    "experiments/tests",
]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
